version: 2

# CTP 3 - Exercise 1: document and govern the staging models.
# For each model: description, meta (owner, steward, domain, tier); for each column: description,
# and for personal data: tags: ['pii'] + meta: {classification: confidential|restricted}.

models:
  - name: stg_customers
    description: "One row per customer account, cleaned from raw.customers (exact duplicate rows removed, ISO country codes, ISO dates)."
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: customer
      tier: gold
    columns:
      - name: customer_id
        description: "Technical identifier of the customer account. One person may have several accounts (see duplicates)."
        data_tests: [unique, not_null]
        tags: ["pii"]
        meta: { classification: confidential }
      - name: email
        description: "Login email, trimmed and lower-cased."
        tags: ["pii"]
        meta: { classification: confidential }
      # TODO: document first_name, last_name, phone, birth_date, city, country_code, signup_date,
      #       has_marketing_consent, loyalty_tier  (description + pii tag/classification where needed)
      # TODO: add a test: accepted_values on country_code (FR, DE, ES, BE) and on loyalty_tier
      - name: first_name
        description: "Customer's first name."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: last_name
        description: "Customer's last name."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: phone
        description: "Customer phone number as supplied by the source system."
        tags: ["pii"]
        meta: { classification: restricted }
      - name: birth_date
        description: "Customer date of birth, parsed as a date."
        tags: ["pii"]
        meta: { classification: restricted }
      - name: city
        description: "City associated with the customer's address."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: country_code
        description: "Standardized two-letter country code for the customer."
        data_tests:
          - accepted_values:
              arguments:
                values: ["FR", "DE", "ES", "BE"]
        tags: ["pii"]
        meta: { classification: confidential }
      - name: signup_date
        description: "Date the customer account was registered."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: has_marketing_consent
        description: "Whether the customer has given consent to marketing."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: loyalty_tier
        description: "Customer's normalized loyalty program tier."
        data_tests:
          - accepted_values:
              arguments:
                values: ["bronze", "silver", "gold", "platinum"]
        tags: ["pii"]
        meta: { classification: confidential }

  - name: stg_orders
    description: "One row per ShopFast order; duplicate order IDs are removed and statuses are standardized."
    # TODO: meta owner / steward / domain / tier
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Senior analyst"
      domain: sales
      tier: gold
    columns:
      - name: order_id
        description: "Technical identifier for a ShopFast order."
        data_tests: [unique, not_null]
        tags: ["pii"]
        meta: { classification: confidential }
      # TODO: document customer_id, order_date, status, channel, shipping_country, total_amount_eur
      # TODO: test accepted_values on status
      - name: customer_id
        description: "Identifier of the customer account that placed the order."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: order_date
        description: "Calendar date on which the order was placed."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: status
        description: "Standardized lifecycle status of the order."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  ["pending", "shipped", "delivered", "cancelled", "returned"]
        tags: ["pii"]
        meta: { classification: confidential }
      - name: channel
        description: "Sales channel through which the order was placed."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: shipping_country
        description: "Country code for the order's shipping destination."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: total_amount_eur
        description: "Total order amount in euros, stored with two decimal places."
        tags: ["pii"]
        meta: { classification: confidential }

  - name: stg_order_items
    description: "One row per product line of an order."
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Karim Benali (Analytics Engineer)"
      domain: sales
      tier: gold
    columns:
      - name: order_item_id
        description: "Technical identifier for an order line."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: order_id
        description: "Identifier of the order containing this product line."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: product_id
        description: "Identifier of the product included in this order line."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: quantity
        description: "Number of product units in this order line."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: unit_price_eur
        description: "Price per product unit in euros."
        tags: ["pii"]
        meta: { classification: confidential }
  - name: stg_payments
    description: "One row per payment event from the payment provider (captured or refunded)."
    # TODO: what is the UNIT of amount? Document it - this is the cents incident!
    meta:
      owner: "Sara Martin (Head of Sales)"
      steward: "Senior analyst"
      domain: finance
      tier: gold
    columns:
      - name: payment_id
        description: "Technical identifier for a payment event."
        data_tests: [unique, not_null]
        tags: ["pii"]
        meta: { classification: confidential }
      - name: order_id
        description: "Identifier of the order associated with the payment."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: payment_date
        description: "Date on which the payment event was recorded."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: method
        description: "Payment method used for the transaction."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: amount
        description: "Payment amount in euros, represented to two decimal places."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: currency
        description: "Currency code for the payment; the supplied dataset uses EUR."
        tags: ["pii"]
        meta: { classification: confidential }
      - name: card_last4
        description: "Last four digits of the payment card, when supplied."
        tags: ["pii"]
        meta: { classification: restricted }
      - name: payment_status
        description: "Whether the payment event was captured or refunded."
        tags: ["pii"]
        meta: { classification: confidential }
  - name: stg_products
    description: "Product catalogue with list prices."
    meta:
      owner: "Product Lead"
      steward: "Karim Benali (Analytics Engineer)"
      domain: product
      tier: gold
    columns:
      - name: product_id
        description: "Technical identifier for a catalogue product."
      - name: sku
        description: "ShopFast stock keeping unit used to identify the product."
      - name: product_name
        description: "Product name shown in the ShopFast catalogue."
      - name: category
        description: "Normalized product category."
      - name: list_price_eur
        description: "Product list price in euros."
      - name: supplier
        description: "Supplier listed for the product."
      - name: is_active
        description: "Whether the product is currently active in the catalogue."
